name: Docker Build & Publish

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/dryad-naiad-software

jobs:
  build-manager:
    name: Build manager (amd64 + arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Cache Caddy binaries
        uses: actions/cache@v4
        with:
          path: .tmp/caddy
          # Cache key includes the --multi-arch platform list so that
          # changing the list (add/remove an arch) invalidates the
          # cache and forces a fresh fetch — prevents a stale cache
          # serving content whose shape no longer matches the
          # Dockerfile COPY requirements.
          key: caddy-docker-${{ hashFiles('tools/caddy.lock') }}-${{ runner.os }}-${{ runner.arch }}-linux-amd64-linux-arm64
      - name: Fetch Caddy (multi-arch)
        run: python tools/fetch_caddy.py --target-dir .tmp/caddy --multi-arch linux-amd64,linux-arm64
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/sethlans-manager
          tags: |
            type=edge,branch=master
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/manager/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-worker-cpu:
    name: Build worker-cpu (amd64 + arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Cache Caddy binaries
        uses: actions/cache@v4
        with:
          path: .tmp/caddy
          # Same key shape as build-manager so this job can share
          # the manager's cache entry: the Dockerfile COPY pattern
          # (.tmp/caddy/linux-${TARGETARCH}/caddy) requires the
          # per-platform subdirectory layout that --multi-arch
          # produces.
          key: caddy-docker-${{ hashFiles('tools/caddy.lock') }}-${{ runner.os }}-${{ runner.arch }}-linux-amd64-linux-arm64
      - name: Fetch Caddy (multi-arch)
        run: python tools/fetch_caddy.py --target-dir .tmp/caddy --multi-arch linux-amd64,linux-arm64
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/sethlans-worker-cpu
          tags: |
            type=edge,branch=master
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/worker-cpu/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-worker-nvidia:
    name: Build worker-nvidia (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Cache Caddy binaries
        uses: actions/cache@v4
        with:
          path: .tmp/caddy
          # Single-platform worker build, but the Dockerfile COPY
          # path (.tmp/caddy/linux-${TARGETARCH}/caddy) needs the
          # per-platform subdirectory layout that --multi-arch
          # produces. Using --platform would write to
          # .tmp/caddy/caddy without the subdir prefix and break
          # the COPY.
          key: caddy-docker-${{ hashFiles('tools/caddy.lock') }}-${{ runner.os }}-${{ runner.arch }}-linux-amd64
      - name: Fetch Caddy (amd64)
        run: python tools/fetch_caddy.py --target-dir .tmp/caddy --multi-arch linux-amd64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/sethlans-worker-nvidia
          tags: |
            type=edge,branch=master
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/worker-nvidia/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-worker-rocm:
    name: Build worker-rocm (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Cache Caddy binaries
        uses: actions/cache@v4
        with:
          path: .tmp/caddy
          # See build-worker-nvidia for why --multi-arch is used
          # even for a single-platform build: the Dockerfile COPY
          # expects the .tmp/caddy/linux-${TARGETARCH}/ layout.
          key: caddy-docker-${{ hashFiles('tools/caddy.lock') }}-${{ runner.os }}-${{ runner.arch }}-linux-amd64
      - name: Fetch Caddy (amd64)
        run: python tools/fetch_caddy.py --target-dir .tmp/caddy --multi-arch linux-amd64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/sethlans-worker-rocm
          tags: |
            type=edge,branch=master
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/worker-rocm/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
