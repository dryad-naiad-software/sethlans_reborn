name: Docker Test Suite

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-test-image:
    name: Build test image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Cache Caddy binaries
        uses: actions/cache@v5
        with:
          path: .tmp/caddy
          # Cache key includes the --multi-arch platform list so that
          # changing the list (add/remove an arch) invalidates the
          # cache and forces a fresh fetch — prevents a stale cache
          # serving content whose shape no longer matches the
          # Dockerfile COPY requirements.
          key: caddy-docker-${{ hashFiles('tools/caddy.lock') }}-${{ runner.os }}-${{ runner.arch }}-linux-amd64-linux-arm64
      - name: Fetch Caddy (multi-arch)
        run: python tools/fetch_caddy.py --target-dir .tmp/caddy --multi-arch linux-amd64,linux-arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/manager/Dockerfile.test
          load: true
          tags: sethlans-test:latest
          cache-from: type=gha,scope=test
          cache-to: type=gha,scope=test,mode=max
      - run: docker save sethlans-test:latest -o /tmp/test-image.tar
      - uses: actions/upload-artifact@v7
        with:
          name: test-image
          path: /tmp/test-image.tar
          retention-days: 1

  build-e2e-image:
    name: Build e2e image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Cache Caddy binaries
        uses: actions/cache@v5
        with:
          path: .tmp/caddy
          # Cache key includes the --multi-arch platform list so that
          # changing the list (add/remove an arch) invalidates the
          # cache and forces a fresh fetch — prevents a stale cache
          # serving content whose shape no longer matches the
          # Dockerfile COPY requirements.
          key: caddy-docker-${{ hashFiles('tools/caddy.lock') }}-${{ runner.os }}-${{ runner.arch }}-linux-amd64-linux-arm64
      - name: Fetch Caddy (multi-arch)
        run: python tools/fetch_caddy.py --target-dir .tmp/caddy --multi-arch linux-amd64,linux-arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/manager/Dockerfile.e2e
          load: true
          tags: sethlans-e2e:latest
          cache-from: type=gha,scope=e2e
          cache-to: type=gha,scope=e2e,mode=max
      - run: docker save sethlans-e2e:latest -o /tmp/e2e-image.tar
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-image
          path: /tmp/e2e-image.tar
          retention-days: 1

  worker-cpu-boot-smoke:
    # Image-startup smoke for the worker-cpu production image (#144).
    # Build, run, assert the worker boots through five critical-path
    # log markers (imports + TLS + Waitress + Caddy spawn + expected
    # unattended-enrollment exit), and confirm the container exits
    # rc=4 as designed when SETHLANS_WORKER_ENROLLMENT_KEY is unset.
    #
    # Why not HEALTHCHECK validation: the worker is designed to refuse
    # to start without enrollment config (production deployment expects
    # the env var via docker-compose), so polling for HEALTHCHECK=
    # healthy without standing up a stub manager would never succeed.
    # Real-manager smoke is a separate scope (potential follow-on).
    #
    # Catches the same class of regressions as the original #144 design
    # intended: missing repo packages (#157), wrong artifact paths
    # (#158), import-time exceptions in the worker entrypoint chain,
    # Caddy supervisor mis-spawn, and setup-gate / wizard regressions
    # that change the unattended exit path.
    name: worker-cpu boot smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Cache Caddy binaries
        uses: actions/cache@v5
        with:
          path: .tmp/caddy
          # Reuses the same key shape as the other Docker build jobs
          # so cache content can be shared when the lockfile + arch
          # list match.
          key: caddy-docker-${{ hashFiles('tools/caddy.lock') }}-${{ runner.os }}-${{ runner.arch }}-linux-amd64-linux-arm64
      - name: Fetch Caddy (multi-arch)
        run: python tools/fetch_caddy.py --target-dir .tmp/caddy --multi-arch linux-amd64,linux-arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build worker-cpu image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/worker-cpu/Dockerfile
          load: true
          tags: sethlans-worker-cpu:test
          cache-from: type=gha,scope=worker-cpu
          cache-to: type=gha,scope=worker-cpu,mode=max
      - name: Run worker-cpu container (no enrollment key — expect rc=4)
        run: docker run -d --name sethlans-worker-test sethlans-worker-cpu:test
      - name: Verify boot path + expected unattended-key exit
        run: tools/worker_boot_smoke.sh sethlans-worker-test 30
      - name: Cleanup
        if: always()
        run: |
          docker stop sethlans-worker-test || true
          docker rm sethlans-worker-test || true

  lint:
    name: Lint (flake8)
    needs: build-test-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: test-image
          path: /tmp
      - run: docker load -i /tmp/test-image.tar
      - name: Critical lint errors (fail on syntax errors)
        run: >
          docker run --rm sethlans-test:latest
          flake8 --select=E9,F63,F7,F82 --show-source
          --exclude=migrations,node_modules,managed_tools
          manager/ worker/ tests/
      - name: Style lint (report only, do not fail)
        run: >
          docker run --rm sethlans-test:latest
          flake8 --max-line-length 127 --max-complexity 10 --exit-zero
          --exclude=migrations,node_modules,managed_tools
          manager/ worker/ tests/

  unit-tests:
    name: Unit tests
    needs: build-test-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: test-image
          path: /tmp
      - run: docker load -i /tmp/test-image.tar
      - run: mkdir -p results
      - run: >
          docker run --rm -v ${{ github.workspace }}/results:/results
          sethlans-test:latest
          pytest tests/unit
          --junitxml=/results/unit.xml
          --cov=manager --cov=worker
          --cov-report=xml:/results/coverage.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-results
          path: results/

  integration-tests:
    name: Integration tests
    needs: build-test-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: test-image
          path: /tmp
      - run: docker load -i /tmp/test-image.tar
      - run: mkdir -p results
      - run: >
          docker run --rm -v ${{ github.workspace }}/results:/results
          sethlans-test:latest
          pytest tests/integration
          --junitxml=/results/integration.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-test-results
          path: results/

  e2e-tests:
    name: E2E tests
    needs: [build-e2e-image, unit-tests, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: e2e-image
          path: /tmp
      - run: docker load -i /tmp/e2e-image.tar
      - run: mkdir -p results
      - run: >
          docker run --rm -v ${{ github.workspace }}/results:/results
          sethlans-e2e:latest
          pytest tests/e2e -x
          --junitxml=/results/e2e.xml
          --timeout=300
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-test-results
          path: results/
