name: Build Native Installers

# Triggers: version tag push and manual dispatch only.
# MUST NOT trigger on pull_request (protects signing secrets).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign artifacts (requires signing secrets)'
        required: false
        default: false
        type: boolean

# Cancel in-progress runs for the same ref
concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'

jobs:
  # ---------------------------------------------------------------
  # Build: Windows
  # ---------------------------------------------------------------
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compute BUILD_VERSION
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: VERSION='$VERSION' is not X.Y.Z"
            exit 1
          fi
          GIT_HASH=$(git rev-parse --short=5 HEAD)
          BUILD_VERSION="${VERSION}.${GIT_HASH}"
          echo "Build version: $BUILD_VERSION"
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install -r manager/requirements.txt
          pip install -r worker/requirements.txt
          pip install -r wizard/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: manager/frontend/package-lock.json

      - name: Build Angular frontend
        working-directory: manager/frontend
        run: |
          npm ci
          npm run build

      - name: Cache Caddy binary
        uses: actions/cache@v5
        with:
          path: .venv-build/caddy
          key: caddy-${{ hashFiles('tools/caddy.lock') }}-${{ runner.os }}-${{ runner.arch }}

      - name: Fetch Caddy (Windows amd64)
        run: python tools/fetch_caddy.py --target-dir .venv-build/caddy --platform windows-amd64

      - name: Run PyInstaller — Manager
        run: pyinstaller packaging/pyinstaller/manager.spec --noconfirm

      - name: Run PyInstaller — Worker
        run: pyinstaller packaging/pyinstaller/worker.spec --noconfirm

      - name: Run PyInstaller — Tray Helper
        run: pyinstaller packaging/pyinstaller/tray_helper.spec --noconfirm

      - name: Run PyInstaller — Launcher
        run: pyinstaller packaging/pyinstaller/launcher.spec --noconfirm

      - name: Run PyInstaller — Wizard
        run: pyinstaller packaging/pyinstaller/wizard.spec --noconfirm

      - name: Assert Caddy binary bundled (Windows)
        shell: pwsh
        run: |
          # Caddy is in _internal/ per PyInstaller 6.x layout (binaries land
          # in the contents_directory, not next to the entry-point exe).
          if (-not (Test-Path "dist\launcher\_internal\caddy.exe")) {
            Write-Error "dist\launcher\_internal\caddy.exe not present — launcher.spec Caddy inclusion is broken (PyInstaller 6.x places binaries under _internal/)"
            exit 1
          }
          Write-Host "Caddy bundled: dist\launcher\_internal\caddy.exe"

      # --- Smoke Tests (FR-20) ---
      - name: Smoke test — Launcher --version
        run: dist\launcher\run_launcher.exe --version

      - name: Smoke test — Manager starts
        shell: pwsh
        run: |
          $env:SETHLANS_TLS_DATA_DIR = "$env:TEMP\sethlans-smoke-tls"
          $env:SETHLANS_MANAGER_DATA_DIR = "$env:TEMP\sethlans-smoke-data"
          New-Item -ItemType Directory -Force -Path $env:SETHLANS_TLS_DATA_DIR | Out-Null
          New-Item -ItemType Directory -Force -Path $env:SETHLANS_MANAGER_DATA_DIR | Out-Null

          # Capture stdout/stderr so failures are diagnosable. Start-Process
          # -WindowStyle Hidden detaches from the workflow log; without
          # -RedirectStandard* the manager's startup output is invisible.
          $logOut = "$env:TEMP\sethlans-smoke-stdout.log"
          $logErr = "$env:TEMP\sethlans-smoke-stderr.log"
          $proc = Start-Process -FilePath "dist\manager\run_manager.exe" `
            -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput $logOut `
            -RedirectStandardError $logErr
          try {
            # Poll the Waitress loopback port until it binds (max 90s).
            # /api/status/public/ is allowlisted in setup mode (see
            # manager/sethlans_manager/middleware/setup_gate.py) and returns
            # 200 with no admin/sentinel. Port 8088 is the internal loopback
            # listener (waitress_config.DEFAULT_WAITRESS_INTERNAL_PORT);
            # Caddy's TLS port 8080 is supervised by the launcher, not the
            # manager, so this smoke test does not start TLS.
            $status = "000"
            for ($i = 0; $i -lt 90; $i++) {
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:8088/api/status/public/" `
                  -TimeoutSec 2 -ErrorAction Stop
                if ($r.StatusCode -eq 200) { $status = "200"; break }
              } catch { }
              if ($proc.HasExited) {
                Write-Host "Manager process exited early (code $($proc.ExitCode))"
                break
              }
              Start-Sleep -Seconds 1
            }
            if ($status -ne "200") {
              Write-Host "--- manager stdout ---"
              if (Test-Path $logOut) { Get-Content $logOut } else { Write-Host "(empty)" }
              Write-Host "--- manager stderr ---"
              if (Test-Path $logErr) { Get-Content $logErr } else { Write-Host "(empty)" }
              throw "Manager smoke test failed (last status: $status)"
            }
            Write-Host "Manager smoke test passed (HTTP $status)"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      # Wizard smoke test (AC-B4 + AC-B2 + NF-4 / DEVOPS-MED-11):
      # - Fresh tmpdir per run (DEVOPS-MED-9, deleted on step exit even on failure).
      # - Provisions chmod-equivalent .setup_token + .ipc_secret.
      # - Spawns dist/wizard/run_wizard.exe with SETHLANS_WIZARD_PORT=8100.
      # - Polls https://localhost:8100/ with cert-skip; 30 s wall-clock budget.
      # - Asserts dist/wizard <= 30 MB; on overage prints top-10 largest.
      # - Asserts no django/workers/psycopg/pymysql leaked into the bundle.
      # - SIGTERMs the wizard and dumps captured stdout/stderr on failure.
      # MUST run AFTER manager smoke step (DEVOPS-v22-MED-3 ordering).
      - name: Smoke test — Wizard starts
        shell: pwsh
        run: |
          # Bundle introspection (AC-B2): forbidden imports MUST NOT be
          # bundled into the wizard PyInstaller output. Mirrors the
          # pathlib.rglob approach spelled out in AC-B2.
          $forbidden = @('django', 'workers', 'psycopg', 'pymysql')
          $leaks = @()
          foreach ($name in $forbidden) {
            $hits = Get-ChildItem -Path "dist\wizard" -Recurse -Force `
              -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "$name*" }
            if ($hits) {
              $leaks += "$name -> $($hits.FullName -join ', ')"
            }
          }
          if ($leaks.Count -gt 0) {
            Write-Host "--- forbidden bundle entries detected ---"
            $leaks | ForEach-Object { Write-Host $_ }
            throw "Wizard bundle leaked forbidden modules"
          }
          Write-Host "Wizard bundle introspection passed (none of: $($forbidden -join ', '))"

          # Bundle size assertion (NF-4 / DEVOPS-MED-11): 30 MB ceiling.
          $maxBytes = 30 * 1024 * 1024
          $totalBytes = (Get-ChildItem -Path "dist\wizard" -Recurse -Force `
            -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum
          if (-not $totalBytes) { $totalBytes = 0 }
          Write-Host "Wizard bundle size: $totalBytes bytes (ceiling $maxBytes)"
          if ($totalBytes -gt $maxBytes) {
            Write-Host "--- top 10 largest files in dist\wizard ---"
            Get-ChildItem -Path "dist\wizard" -Recurse -Force -File `
              -ErrorAction SilentlyContinue |
              Sort-Object -Property Length -Descending |
              Select-Object -First 10 -Property `
                @{Name='SizeMB';Expression={[math]::Round($_.Length/1MB,2)}}, FullName |
              Format-Table -AutoSize | Out-Host
            throw "Wizard bundle size $totalBytes bytes exceeds NF-4 ceiling $maxBytes bytes"
          }

          # Provision a fresh per-run tmpdir (DEVOPS-MED-9). Cleaned up
          # in the finally block regardless of success/failure.
          $tmpRoot = Join-Path $env:TEMP ("sethlans-wizard-smoke-" + [guid]::NewGuid().ToString('N'))
          $wizardDir = Join-Path $tmpRoot "wizard"
          New-Item -ItemType Directory -Force -Path $wizardDir | Out-Null

          # Setup token + IPC secret: 32 random bytes hex-encoded each.
          # Single-line, non-empty. Windows ACLs already restrict %TEMP%
          # subdir to the current user; explicit chmod-600 not applicable.
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          $buf = New-Object byte[] 32
          $rng.GetBytes($buf)
          $token = -join ($buf | ForEach-Object { '{0:x2}' -f $_ })
          $rng.GetBytes($buf)
          $secret = -join ($buf | ForEach-Object { '{0:x2}' -f $_ })
          [System.IO.File]::WriteAllText((Join-Path $wizardDir ".setup_token"), $token)
          [System.IO.File]::WriteAllText((Join-Path $wizardDir ".ipc_secret"), $secret)

          $env:SETHLANS_WIZARD_PORT = "8100"
          $env:SETHLANS_DATA_DIR = $tmpRoot

          $logOut = Join-Path $tmpRoot "wizard-stdout.log"
          $logErr = Join-Path $tmpRoot "wizard-stderr.log"
          $proc = Start-Process -FilePath "dist\wizard\run_wizard.exe" `
            -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput $logOut `
            -RedirectStandardError $logErr
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          try {
            # Poll https://localhost:8100/ until 200 within 30 s
            # (AC-B4 + DEVOPS-v22-MED-2: 30 s startup, 30 s shutdown headroom).
            $status = "000"
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $r = Invoke-WebRequest -Uri "https://localhost:8100/" `
                  -SkipCertificateCheck -TimeoutSec 2 -ErrorAction Stop
                if ($r.StatusCode -eq 200) { $status = "200"; break }
              } catch { }
              if ($proc.HasExited) {
                Write-Host "Wizard process exited early (code $($proc.ExitCode)) after $($sw.Elapsed.TotalSeconds)s"
                break
              }
              Start-Sleep -Seconds 1
            }
            if ($status -ne "200") {
              Write-Host "--- wizard stdout ---"
              if (Test-Path $logOut) { Get-Content $logOut } else { Write-Host "(empty)" }
              Write-Host "--- wizard stderr ---"
              if (Test-Path $logErr) { Get-Content $logErr } else { Write-Host "(empty)" }
              throw "Wizard smoke test failed (last status: $status, elapsed $($sw.Elapsed.TotalSeconds)s)"
            }
            Write-Host "Wizard smoke test passed (HTTP $status in $($sw.Elapsed.TotalSeconds)s)"
          } finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
            Remove-Item -Path $tmpRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke test — Worker starts
        shell: pwsh
        run: |
          $env:SETHLANS_WORKER_DATA_DIR = "$env:TEMP\sethlans-smoke-worker"
          New-Item -ItemType Directory -Force -Path $env:SETHLANS_WORKER_DATA_DIR

          $proc = Start-Process -FilePath "dist\worker\run_worker.exe" `
            -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 10

          try {
            $response = Invoke-WebRequest -Uri "https://localhost:8081/api/status" `
              -SkipCertificateCheck -TimeoutSec 10 -ErrorAction SilentlyContinue
            Write-Host "Worker smoke test passed"
          } catch {
            Write-Host "Worker smoke test: process started (status endpoint may require enrollment)"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      # --- Code signing (conditional) ---
      - name: Sign executables (Authenticode)
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
          || (github.event.inputs.sign == 'true')
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if (-not $env:SIGNING_CERT_BASE64) {
            Write-Host "Signing secrets not available, skipping."
            exit 0
          }
          $certPath = "$env:TEMP\signing-cert.pfx"
          [System.IO.File]::WriteAllBytes(
            $certPath,
            [System.Convert]::FromBase64String($env:SIGNING_CERT_BASE64)
          )

          $exeFiles = Get-ChildItem -Path "dist" -Recurse -Filter "*.exe"
          foreach ($exe in $exeFiles) {
            & signtool sign /fd SHA256 /f $certPath /p $env:SIGNING_CERT_PASSWORD `
              /tr http://timestamp.digicert.com /td SHA256 $exe.FullName
          }

          Remove-Item $certPath -Force

      # --- Build NSIS installer ---
      - name: Build NSIS installer
        run: |
          choco install nsis -y --no-progress
          # choco doesn't refresh PATH in the same pwsh session, so call
          # makensis by full path. NSIS installs to the standard 32-bit
          # Program Files location regardless of host arch.
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          & $makensis /DPRODUCT_VERSION=$env:BUILD_VERSION packaging\windows\sethlans.nsi
        shell: pwsh

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: packaging/windows/sethlans-*.exe
          if-no-files-found: warn

  # ---------------------------------------------------------------
  # Build: macOS
  # ---------------------------------------------------------------
  build-macos:
    name: Build macOS Installer
    runs-on: macos-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compute BUILD_VERSION
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: VERSION='$VERSION' is not X.Y.Z"
            exit 1
          fi
          GIT_HASH=$(git rev-parse --short=5 HEAD)
          BUILD_VERSION="${VERSION}.${GIT_HASH}"
          echo "Build version: $BUILD_VERSION"
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install -r manager/requirements.txt
          pip install -r worker/requirements.txt
          pip install -r wizard/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: manager/frontend/package-lock.json

      - name: Build Angular frontend
        working-directory: manager/frontend
        run: |
          npm ci
          npm run build

      - name: Cache Caddy binary
        uses: actions/cache@v5
        with:
          path: .venv-build/caddy
          key: caddy-${{ hashFiles('tools/caddy.lock') }}-${{ runner.os }}-${{ runner.arch }}

      - name: Fetch Caddy (macOS arm64)
        run: python tools/fetch_caddy.py --target-dir .venv-build/caddy --platform darwin-arm64

      - name: Run PyInstaller — Manager
        run: pyinstaller packaging/pyinstaller/manager.spec --noconfirm

      - name: Run PyInstaller — Worker
        run: pyinstaller packaging/pyinstaller/worker.spec --noconfirm

      - name: Run PyInstaller — Tray Helper
        run: pyinstaller packaging/pyinstaller/tray_helper.spec --noconfirm

      - name: Run PyInstaller — Launcher
        run: pyinstaller packaging/pyinstaller/launcher.spec --noconfirm

      - name: Run PyInstaller — Wizard
        run: pyinstaller packaging/pyinstaller/wizard.spec --noconfirm

      - name: Assert Caddy binary bundled (macOS)
        run: |
          # Caddy is in _internal/ per PyInstaller 6.x layout (binaries land
          # in the contents_directory, not next to the entry-point exe).
          if [ ! -x "dist/launcher/_internal/caddy" ]; then
            echo "dist/launcher/_internal/caddy not present or not executable — launcher.spec Caddy inclusion is broken (PyInstaller 6.x places binaries under _internal/)"
            exit 1
          fi
          echo "Caddy bundled: dist/launcher/_internal/caddy"

      # --- Smoke Tests (FR-20) ---
      - name: Smoke test — Launcher --version
        run: dist/launcher/run_launcher --version

      - name: Smoke test — Manager starts
        run: |
          export SETHLANS_TLS_DATA_DIR="$(mktemp -d)"
          export SETHLANS_MANAGER_DATA_DIR="$(mktemp -d)"

          dist/manager/run_manager &
          MGR_PID=$!
          trap 'kill $MGR_PID 2>/dev/null || true' EXIT

          # Poll the Waitress loopback port until it binds (max 90s).
          # /api/status/public/ is allowlisted in setup mode (see
          # manager/sethlans_manager/middleware/setup_gate.py) and returns
          # 200 with no admin/sentinel. Port 8088 is the internal loopback
          # listener (waitress_config.DEFAULT_WAITRESS_INTERNAL_PORT);
          # Caddy's TLS port 8080 is supervised by the launcher, not the
          # manager, so this smoke test does not start TLS.
          STATUS="000"
          for i in $(seq 1 90); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:8088/api/status/public/ 2>/dev/null || echo "000")
            if [ "$CODE" = "200" ]; then
              STATUS="200"
              break
            fi
            sleep 1
          done

          if [ "$STATUS" = "200" ]; then
            echo "Manager smoke test passed (HTTP ${STATUS})"
          else
            echo "Manager smoke test failed (HTTP ${STATUS})"
            exit 1
          fi

      # Wizard smoke test (AC-B4 + AC-B2 + NF-4 / DEVOPS-MED-11):
      # - Fresh tmpdir per run (DEVOPS-MED-9, deleted on exit via trap).
      # - Provisions chmod-600 .setup_token + .ipc_secret.
      # - Spawns dist/wizard/run_wizard with SETHLANS_WIZARD_PORT=8100.
      # - Polls https://localhost:8100/ with curl -fsk; 30 s budget.
      # - Asserts dist/wizard <= 30 MB; on overage prints top-10 largest.
      # - Asserts no django/workers/psycopg/pymysql leaked into the bundle.
      # - SIGTERMs the wizard and dumps captured stdout/stderr on failure.
      # MUST run AFTER manager smoke step (DEVOPS-v22-MED-3 ordering).
      - name: Smoke test — Wizard starts
        run: |
          set -u
          # Bundle introspection (AC-B2): forbidden imports MUST NOT be
          # bundled into the wizard PyInstaller output.
          LEAKS=""
          for name in django workers psycopg pymysql; do
            HITS=$(find dist/wizard -name "${name}*" 2>/dev/null || true)
            if [ -n "$HITS" ]; then
              LEAKS="${LEAKS}${name}: ${HITS}\n"
            fi
          done
          if [ -n "$LEAKS" ]; then
            printf -- "--- forbidden bundle entries detected ---\n%b" "$LEAKS"
            echo "Wizard bundle leaked forbidden modules"
            exit 1
          fi
          echo "Wizard bundle introspection passed (none of: django workers psycopg pymysql)"

          # Bundle size assertion (NF-4 / DEVOPS-MED-11): 30 MB ceiling.
          MAX_BYTES=$((30 * 1024 * 1024))
          # macOS du(1) lacks -b; use -k (KB) and convert to bytes.
          SIZE_KB=$(du -sk dist/wizard | awk '{print $1}')
          TOTAL_BYTES=$((SIZE_KB * 1024))
          echo "Wizard bundle size: ${TOTAL_BYTES} bytes (ceiling ${MAX_BYTES})"
          if [ "$TOTAL_BYTES" -gt "$MAX_BYTES" ]; then
            echo "--- top 10 largest files in dist/wizard ---"
            find dist/wizard -type f -exec du -sh {} + | sort -hr | head -n 10
            echo "Wizard bundle size ${TOTAL_BYTES} bytes exceeds NF-4 ceiling ${MAX_BYTES} bytes"
            exit 1
          fi

          # Fresh tmpdir per run (DEVOPS-MED-9). trap cleans up on any exit.
          TMP_ROOT=$(mktemp -d -t sethlans-wizard-smoke-XXXXXX)
          WIZARD_DIR="${TMP_ROOT}/wizard"
          mkdir -p "${WIZARD_DIR}"

          WIZARD_PID=""
          cleanup() {
            if [ -n "${WIZARD_PID}" ]; then
              kill "${WIZARD_PID}" 2>/dev/null || true
              wait "${WIZARD_PID}" 2>/dev/null || true
            fi
            rm -rf "${TMP_ROOT}" 2>/dev/null || true
          }
          trap cleanup EXIT

          # Setup token + IPC secret: 32 random bytes hex-encoded each.
          # chmod 600 per FR-L3a / FR-L4a transport rules.
          openssl rand -hex 32 > "${WIZARD_DIR}/.setup_token"
          openssl rand -hex 32 > "${WIZARD_DIR}/.ipc_secret"
          chmod 600 "${WIZARD_DIR}/.setup_token" "${WIZARD_DIR}/.ipc_secret"

          export SETHLANS_WIZARD_PORT=8100
          export SETHLANS_DATA_DIR="${TMP_ROOT}"

          LOG_OUT="${TMP_ROOT}/wizard-stdout.log"
          LOG_ERR="${TMP_ROOT}/wizard-stderr.log"
          dist/wizard/run_wizard > "${LOG_OUT}" 2> "${LOG_ERR}" &
          WIZARD_PID=$!

          # Poll https://localhost:8100/ until 200 within 30 s
          # (AC-B4 + DEVOPS-v22-MED-2: 30 s startup budget).
          STATUS="000"
          ELAPSED=0
          for i in $(seq 1 30); do
            CODE=$(curl -fsk -o /dev/null -w '%{http_code}' \
              https://localhost:8100/ 2>/dev/null || echo "000")
            if [ "$CODE" = "200" ]; then
              STATUS="200"
              break
            fi
            if ! kill -0 "${WIZARD_PID}" 2>/dev/null; then
              echo "Wizard process exited early after ${ELAPSED}s"
              break
            fi
            sleep 1
            ELAPSED=$((ELAPSED + 1))
          done

          if [ "$STATUS" != "200" ]; then
            echo "--- wizard stdout ---"
            [ -f "${LOG_OUT}" ] && cat "${LOG_OUT}" || echo "(empty)"
            echo "--- wizard stderr ---"
            [ -f "${LOG_ERR}" ] && cat "${LOG_ERR}" || echo "(empty)"
            echo "Wizard smoke test failed (HTTP ${STATUS}, elapsed ${ELAPSED}s)"
            exit 1
          fi
          echo "Wizard smoke test passed (HTTP ${STATUS} in ${ELAPSED}s)"

      # --- Code signing (conditional) ---
      - name: Import signing certificate
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
          || (github.event.inputs.sign == 'true')
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_SIGNING_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "${MACOS_CERT_BASE64}" ]; then
            echo "Signing secrets not available, skipping."
            exit 0
          fi
          CERT_PATH=$(mktemp /tmp/cert.XXXXXX.p12)
          echo "${MACOS_CERT_BASE64}" | base64 --decode > "${CERT_PATH}"

          KEYCHAIN_PATH="${RUNNER_TEMP}/signing.keychain-db"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" -P "${MACOS_CERT_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security list-keychain -d user -s "${KEYCHAIN_PATH}"

          rm -f "${CERT_PATH}"

      - name: Sign and notarize .app bundle
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
          || (github.event.inputs.sign == 'true')
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARIZATION_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [ -z "${SIGNING_IDENTITY}" ]; then
            echo "Signing identity not available, skipping."
            exit 0
          fi
          ENTITLEMENTS="packaging/macos/entitlements.plist"

          # Sign the .app bundle
          codesign --deep --force --options runtime \
            --sign "${SIGNING_IDENTITY}" \
            --entitlements "${ENTITLEMENTS}" \
            dist/launcher/Sethlans.app

      # --- Build DMG ---
      - name: Build DMG
        run: |
          chmod +x packaging/macos/build_dmg.sh
          packaging/macos/build_dmg.sh "${BUILD_VERSION}"

      - name: Notarize DMG
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
          || (github.event.inputs.sign == 'true')
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARIZATION_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
        run: |
          if [ -z "${APPLE_ID}" ]; then
            echo "Notarization secrets not available, skipping."
            exit 0
          fi
          DMG_PATH="dist/sethlans-${BUILD_VERSION}-macos-arm64.dmg"

          xcrun notarytool submit "${DMG_PATH}" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_PASSWORD}" \
            --wait

          xcrun stapler staple "${DMG_PATH}"

      - name: Upload macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: macos-installer
          path: dist/sethlans-*-macos-*.dmg
          if-no-files-found: warn

  # ---------------------------------------------------------------
  # Build: Linux
  # ---------------------------------------------------------------
  build-linux:
    name: Build Linux Installer
    runs-on: ubuntu-22.04
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compute BUILD_VERSION
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: VERSION='$VERSION' is not X.Y.Z"
            exit 1
          fi
          GIT_HASH=$(git rev-parse --short=5 HEAD)
          BUILD_VERSION="${VERSION}.${GIT_HASH}"
          echo "Build version: $BUILD_VERSION"
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y makeself

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install -r manager/requirements.txt
          pip install -r worker/requirements.txt
          pip install -r wizard/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: manager/frontend/package-lock.json

      - name: Build Angular frontend
        working-directory: manager/frontend
        run: |
          npm ci
          npm run build

      - name: Cache Caddy binary
        uses: actions/cache@v5
        with:
          path: .venv-build/caddy
          key: caddy-${{ hashFiles('tools/caddy.lock') }}-${{ runner.os }}-${{ runner.arch }}

      - name: Fetch Caddy (Linux amd64)
        run: python tools/fetch_caddy.py --target-dir .venv-build/caddy --platform linux-amd64

      - name: Run PyInstaller — Manager
        run: pyinstaller packaging/pyinstaller/manager.spec --noconfirm

      - name: Run PyInstaller — Worker
        run: pyinstaller packaging/pyinstaller/worker.spec --noconfirm

      - name: Run PyInstaller — Tray Helper
        run: pyinstaller packaging/pyinstaller/tray_helper.spec --noconfirm

      - name: Run PyInstaller — Launcher
        run: pyinstaller packaging/pyinstaller/launcher.spec --noconfirm

      - name: Run PyInstaller — Wizard
        run: pyinstaller packaging/pyinstaller/wizard.spec --noconfirm

      - name: Assert Caddy binary bundled (Linux)
        run: |
          # Caddy is in _internal/ per PyInstaller 6.x layout (binaries land
          # in the contents_directory, not next to the entry-point exe).
          if [ ! -x "dist/launcher/_internal/caddy" ]; then
            echo "dist/launcher/_internal/caddy not present or not executable — launcher.spec Caddy inclusion is broken (PyInstaller 6.x places binaries under _internal/)"
            exit 1
          fi
          echo "Caddy bundled: dist/launcher/_internal/caddy"

      # --- Smoke Tests (FR-20) ---
      - name: Smoke test — Launcher --version
        run: dist/launcher/run_launcher --version

      - name: Smoke test — Manager starts
        run: |
          export SETHLANS_TLS_DATA_DIR="$(mktemp -d)"
          export SETHLANS_MANAGER_DATA_DIR="$(mktemp -d)"

          dist/manager/run_manager &
          MGR_PID=$!
          trap 'kill $MGR_PID 2>/dev/null || true' EXIT

          # Poll the Waitress loopback port until it binds (max 90s).
          # /api/status/public/ is allowlisted in setup mode (see
          # manager/sethlans_manager/middleware/setup_gate.py) and returns
          # 200 with no admin/sentinel. Port 8088 is the internal loopback
          # listener (waitress_config.DEFAULT_WAITRESS_INTERNAL_PORT);
          # Caddy's TLS port 8080 is supervised by the launcher, not the
          # manager, so this smoke test does not start TLS.
          STATUS="000"
          for i in $(seq 1 90); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:8088/api/status/public/ 2>/dev/null || echo "000")
            if [ "$CODE" = "200" ]; then
              STATUS="200"
              break
            fi
            sleep 1
          done

          if [ "$STATUS" = "200" ]; then
            echo "Manager smoke test passed (HTTP ${STATUS})"
          else
            echo "Manager smoke test failed (HTTP ${STATUS})"
            exit 1
          fi

      # Wizard smoke test (AC-B4 + AC-B2 + NF-4 / DEVOPS-MED-11):
      # - Fresh tmpdir per run (DEVOPS-MED-9, deleted on exit via trap).
      # - Provisions chmod-600 .setup_token + .ipc_secret.
      # - Spawns dist/wizard/run_wizard with SETHLANS_WIZARD_PORT=8100.
      # - Polls https://localhost:8100/ with curl -fsk; 30 s budget.
      # - Asserts dist/wizard <= 30 MB; on overage prints top-10 largest.
      # - Asserts no django/workers/psycopg/pymysql leaked into the bundle.
      # - SIGTERMs the wizard and dumps captured stdout/stderr on failure.
      # MUST run AFTER manager smoke step (DEVOPS-v22-MED-3 ordering).
      - name: Smoke test — Wizard starts
        run: |
          set -u
          # Bundle introspection (AC-B2): forbidden imports MUST NOT be
          # bundled into the wizard PyInstaller output.
          LEAKS=""
          for name in django workers psycopg pymysql; do
            HITS=$(find dist/wizard -name "${name}*" 2>/dev/null || true)
            if [ -n "$HITS" ]; then
              LEAKS="${LEAKS}${name}: ${HITS}\n"
            fi
          done
          if [ -n "$LEAKS" ]; then
            printf -- "--- forbidden bundle entries detected ---\n%b" "$LEAKS"
            echo "Wizard bundle leaked forbidden modules"
            exit 1
          fi
          echo "Wizard bundle introspection passed (none of: django workers psycopg pymysql)"

          # Bundle size assertion (NF-4 / DEVOPS-MED-11): 30 MB ceiling.
          MAX_BYTES=$((30 * 1024 * 1024))
          TOTAL_BYTES=$(du -sb dist/wizard | awk '{print $1}')
          echo "Wizard bundle size: ${TOTAL_BYTES} bytes (ceiling ${MAX_BYTES})"
          if [ "$TOTAL_BYTES" -gt "$MAX_BYTES" ]; then
            echo "--- top 10 largest files in dist/wizard ---"
            find dist/wizard -type f -exec du -sh {} + | sort -hr | head -n 10
            echo "Wizard bundle size ${TOTAL_BYTES} bytes exceeds NF-4 ceiling ${MAX_BYTES} bytes"
            exit 1
          fi

          # Fresh tmpdir per run (DEVOPS-MED-9). trap cleans up on any exit.
          TMP_ROOT=$(mktemp -d -t sethlans-wizard-smoke-XXXXXX)
          WIZARD_DIR="${TMP_ROOT}/wizard"
          mkdir -p "${WIZARD_DIR}"

          WIZARD_PID=""
          cleanup() {
            if [ -n "${WIZARD_PID}" ]; then
              kill "${WIZARD_PID}" 2>/dev/null || true
              wait "${WIZARD_PID}" 2>/dev/null || true
            fi
            rm -rf "${TMP_ROOT}" 2>/dev/null || true
          }
          trap cleanup EXIT

          # Setup token + IPC secret: 32 random bytes hex-encoded each.
          # chmod 600 per FR-L3a / FR-L4a transport rules.
          openssl rand -hex 32 > "${WIZARD_DIR}/.setup_token"
          openssl rand -hex 32 > "${WIZARD_DIR}/.ipc_secret"
          chmod 600 "${WIZARD_DIR}/.setup_token" "${WIZARD_DIR}/.ipc_secret"

          export SETHLANS_WIZARD_PORT=8100
          export SETHLANS_DATA_DIR="${TMP_ROOT}"

          LOG_OUT="${TMP_ROOT}/wizard-stdout.log"
          LOG_ERR="${TMP_ROOT}/wizard-stderr.log"
          dist/wizard/run_wizard > "${LOG_OUT}" 2> "${LOG_ERR}" &
          WIZARD_PID=$!

          # Poll https://localhost:8100/ until 200 within 30 s
          # (AC-B4 + DEVOPS-v22-MED-2: 30 s startup budget).
          STATUS="000"
          ELAPSED=0
          for i in $(seq 1 30); do
            CODE=$(curl -fsk -o /dev/null -w '%{http_code}' \
              https://localhost:8100/ 2>/dev/null || echo "000")
            if [ "$CODE" = "200" ]; then
              STATUS="200"
              break
            fi
            if ! kill -0 "${WIZARD_PID}" 2>/dev/null; then
              echo "Wizard process exited early after ${ELAPSED}s"
              break
            fi
            sleep 1
            ELAPSED=$((ELAPSED + 1))
          done

          if [ "$STATUS" != "200" ]; then
            echo "--- wizard stdout ---"
            [ -f "${LOG_OUT}" ] && cat "${LOG_OUT}" || echo "(empty)"
            echo "--- wizard stderr ---"
            [ -f "${LOG_ERR}" ] && cat "${LOG_ERR}" || echo "(empty)"
            echo "Wizard smoke test failed (HTTP ${STATUS}, elapsed ${ELAPSED}s)"
            exit 1
          fi
          echo "Wizard smoke test passed (HTTP ${STATUS} in ${ELAPSED}s)"

      # --- GPG signing (conditional) ---
      - name: Import GPG key
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
          || (github.event.inputs.sign == 'true')
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "${GPG_PRIVATE_KEY}" ]; then
            echo "GPG key not available, skipping."
            exit 0
          fi
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import

      # --- Build .run installer ---
      - name: Build .run installer
        run: |
          chmod +x packaging/linux/build_run.sh
          packaging/linux/build_run.sh "${BUILD_VERSION}"

      - name: Sign .run installer (GPG)
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
          || (github.event.inputs.sign == 'true')
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "${GPG_PRIVATE_KEY}" ]; then
            echo "GPG key not available, skipping signing."
            exit 0
          fi
          RUN_FILE="dist/sethlans-${BUILD_VERSION}-linux-x64.run"
          if [ -f "${RUN_FILE}" ]; then
            gpg --batch --yes --detach-sign --armor "${RUN_FILE}"
          fi

      - name: Upload Linux installer
        uses: actions/upload-artifact@v7
        with:
          name: linux-installer
          path: |
            dist/sethlans-*-linux-*.run
            dist/sethlans-*-linux-*.run.asc
          if-no-files-found: warn

  # ---------------------------------------------------------------
  # Release: create GitHub Release on tag push
  # ---------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.exe" -o -name "*.dmg" \
            -o -name "*.run" -o -name "*.msi" \) \
            -exec sha256sum {} \; | sort > checksums.txt
          cat checksums.txt

      - name: Sign checksums (GPG)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "${GPG_PRIVATE_KEY}" ]; then
            echo "${GPG_PRIVATE_KEY}" | gpg --batch --import
            gpg --batch --yes --detach-sign --armor \
              artifacts/checksums.txt
          else
            echo "GPG key not available, checksums unsigned."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.run
            artifacts/**/*.msi
            artifacts/**/*.asc
            artifacts/checksums.txt
            artifacts/checksums.txt.asc
