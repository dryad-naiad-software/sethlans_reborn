name: Sethlans Reborn CI

# GitHub-hosted Docker-based Linux CI (unit, integration, lint) is
# additionally handled by docker-test.yml using containerized test
# images. This workflow covers:
#   1. Native GitHub-hosted matrix (ubuntu/windows/macos) — catches
#      platform-specific regressions Docker cannot (e.g. Windows path
#      handling, macOS PySide6 splash segfaults, native Linux without
#      containerization).
#   2. Self-hosted GPU runners and self-hosted macOS e2e tests that
#      Docker cannot provide (GPU passthrough, native macOS on Apple
#      Silicon).

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # --- GitHub-Hosted Native Matrix (ubuntu / windows / macos) ---
  build-and-test-github:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.14"]
    runs-on: ${{ matrix.os }}
    env:
      # Belt-and-suspenders: pytest.ini also sets this, but mirror the
      # self-hosted jobs' env-declaration style for visibility.
      SETHLANS_DISABLE_RELEASE_FETCH: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libglib2.0-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libx11-6 \
            libxxf86vm1 \
            libxrender1 \
            libxi6 \
            libglu1-mesa \
            libsm6 \
            libice6 \
            libxfixes3 \
            libxcursor1 \
            libxinerama1 \
            libxrandr2 \
            xvfb

      - name: Cache pip dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache pip dependencies (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r manager/requirements.txt -r worker/requirements.txt -r requirements-dev.txt

      - name: Cache Caddy binary
        uses: actions/cache@v4
        with:
          path: .venv-build/caddy
          key: caddy-${{ hashFiles('tools/caddy.lock') }}-${{ runner.os }}-${{ runner.arch }}

      - name: Fetch Caddy (Linux)
        if: runner.os == 'Linux'
        run: python tools/fetch_caddy.py --target-dir .venv-build/caddy --platform linux-amd64

      - name: Fetch Caddy (Windows)
        if: runner.os == 'Windows'
        run: python tools/fetch_caddy.py --target-dir .venv-build/caddy --platform windows-amd64

      - name: Fetch Caddy (macOS)
        if: runner.os == 'macOS'
        run: python tools/fetch_caddy.py --target-dir .venv-build/caddy --platform darwin-arm64

      - name: Cache Managed Blender Tools
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: worker/sethlans_worker_agent/managed_tools
          key: ${{ runner.os }}-blender-lts-${{ hashFiles('worker/sethlans_worker_agent/config.py') }}

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv,managed_tools,node_modules,migrations
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=venv,.venv,managed_tools,node_modules,migrations

      - name: Run Unit Tests
        run: pytest tests/unit

      - name: Run Integration Tests
        run: pytest tests/integration

      - name: Start Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Run End-to-End Tests
        run: pytest tests/e2e

      - name: Attempt to Unmount Any Lingering DMGs (macOS)
        if: runner.os == 'macOS' && always()
        run: |
          echo "Attempting to detach any lingering BlenderMount volumes..."
          hdiutil detach /Volumes/BlenderMount_* || echo "No lingering DMG mount found or detach failed."

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            /tmp/e2e_*/**
            test_artifacts/
            !**/*.blend
          if-no-files-found: ignore

  # --- Self-Hosted Linux GPU Runner ---
  build-and-test-self-hosted-linux:
    name: Test on Self-Hosted Linux GPU (Python ${{ matrix.python-version }})
    runs-on: [self-hosted, linux, x64, gpu]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14.4"]
    env:
      SETHLANS_SELF_HOSTED_RUNNER: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Create and activate venv
        shell: bash
        run: |
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PATH"
          eval "$(pyenv init --path)"
          # Install the pinned interpreter if the runner doesn't already have it (#116).
          pyenv install -s "${{ matrix.python-version }}"
          pyenv global ${{ matrix.python-version }}
          $(pyenv which python) -m venv venv
          echo "PATH=$PWD/venv/bin:$PATH" >> $GITHUB_ENV
          echo "VIRTUAL_ENV=$PWD/venv" >> $GITHUB_ENV
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r manager/requirements.txt -r worker/requirements.txt -r requirements-dev.txt
      - name: Cache Managed Blender Tools
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: worker/sethlans_worker_agent/managed_tools
          key: ${{ runner.os }}-blender-cache-lts-${{ hashFiles('worker/sethlans_worker_agent/config.py') }}
      - name: Cache Caddy binary
        uses: actions/cache@v4
        with:
          path: .venv-build/caddy
          key: caddy-${{ hashFiles('tools/caddy.lock') }}-${{ runner.os }}-${{ runner.arch }}
      - name: Fetch Caddy (Linux amd64)
        run: python tools/fetch_caddy.py --target-dir .venv-build/caddy --platform linux-amd64
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv,managed_tools,node_modules,migrations
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=venv,.venv,managed_tools,node_modules,migrations
      - name: Run Unit Tests
        run: pytest tests/unit
      - name: Run Integration Tests
        run: pytest tests/integration
      - name: Run End-to-End Tests
        run: pytest tests/e2e -x
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-self-hosted-linux-py${{ matrix.python-version }}
          path: |
            /tmp/e2e_*/**
            test_artifacts/
            !**/*.blend
          if-no-files-found: ignore

  # --- Self-Hosted Apple Silicon Mac Runner ---
  build-and-test-self-hosted-macos:
    name: Test on Self-Hosted Apple Silicon (Python ${{ matrix.python-version }})
    runs-on: [self-hosted, macos, arm64]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14.4"]
    env:
      SETHLANS_SELF_HOSTED_RUNNER: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Create and activate venv
        shell: bash
        run: |
          # Add Homebrew's bin directory to the PATH to find pyenv on Apple Silicon.
          export PATH="/opt/homebrew/bin:$PATH"
          eval "$(pyenv init --path)"
          # Install the pinned interpreter if the runner doesn't already have it (#116).
          pyenv install -s "${{ matrix.python-version }}"
          pyenv global ${{ matrix.python-version }}
          $(pyenv which python) -m venv venv
          echo "PATH=$PWD/venv/bin:$PATH" >> $GITHUB_ENV
          echo "VIRTUAL_ENV=$PWD/venv" >> $GITHUB_ENV
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r manager/requirements.txt -r worker/requirements.txt -r requirements-dev.txt
      - name: Cache Managed Blender Tools
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: worker/sethlans_worker_agent/managed_tools
          key: ${{ runner.os }}-blender-cache-lts-${{ hashFiles('worker/sethlans_worker_agent/config.py') }}
      - name: Cache Caddy binary
        uses: actions/cache@v4
        with:
          path: .venv-build/caddy
          key: caddy-${{ hashFiles('tools/caddy.lock') }}-${{ runner.os }}-${{ runner.arch }}
      - name: Fetch Caddy (macOS arm64)
        run: python tools/fetch_caddy.py --target-dir .venv-build/caddy --platform darwin-arm64
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv,managed_tools,node_modules,migrations
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=venv,.venv,managed_tools,node_modules,migrations
      - name: Run Unit Tests
        run: pytest tests/unit
      - name: Run Integration Tests
        run: pytest tests/integration
      - name: Run End-to-End Tests
        run: pytest tests/e2e -x
      - name: Attempt to Unmount Any Lingering DMGs (macOS)
        if: always()
        run: |
          echo "Attempting to detach any lingering BlenderMount volumes..."
          hdiutil detach /Volumes/BlenderMount_* || echo "No lingering DMG mount found or detach failed."
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-self-hosted-macos-py${{ matrix.python-version }}
          path: |
            /tmp/e2e_*/**
            test_artifacts/
            !**/*.blend
          if-no-files-found: ignore