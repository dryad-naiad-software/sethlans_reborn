name: Sethlans Reborn CI (Self-Hosted)

# GitHub-hosted Linux CI (unit, integration, lint) is handled by
# docker-test.yml using containerized test images. This workflow
# covers self-hosted GPU runners and macOS e2e tests that Docker
# cannot provide (GPU passthrough, native macOS).

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # --- Self-Hosted Linux GPU Runner ---
  build-and-test-self-hosted-linux:
    name: Test on Self-Hosted Linux GPU (Python ${{ matrix.python-version }})
    runs-on: [self-hosted, linux, x64, gpu]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    env:
      SETHLANS_SELF_HOSTED_RUNNER: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Create and activate venv
        shell: bash
        run: |
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PATH"
          eval "$(pyenv init --path)"
          pyenv global ${{ matrix.python-version }}
          $(pyenv which python) -m venv venv
          echo "PATH=$PWD/venv/bin:$PATH" >> $GITHUB_ENV
          echo "VIRTUAL_ENV=$PWD/venv" >> $GITHUB_ENV
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r manager/requirements.txt -r worker/requirements.txt -r requirements-dev.txt
      - name: Cache Managed Blender Tools
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: worker/sethlans_worker_agent/managed_tools
          key: ${{ runner.os }}-blender-cache-lts-${{ hashFiles('worker/sethlans_worker_agent/config.py') }}
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv,managed_tools,node_modules,migrations
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=venv,.venv,managed_tools,node_modules,migrations
      - name: Run Unit Tests
        run: pytest tests/unit
      - name: Run Integration Tests
        run: pytest tests/integration
      - name: Run End-to-End Tests
        run: pytest tests/e2e -x
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-self-hosted-linux-py${{ matrix.python-version }}
          path: |
            manager/logs/manager.log
            worker/sethlans_worker_agent/logs/worker.log
            worker/sethlans_worker_agent/worker_output/
            test_artifacts/
            !**/*.blend
          if-no-files-found: ignore

  # --- Self-Hosted Apple Silicon Mac Runner ---
  build-and-test-self-hosted-macos:
    name: Test on Self-Hosted Apple Silicon (Python ${{ matrix.python-version }})
    runs-on: [self-hosted, macos, arm64]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    env:
      SETHLANS_SELF_HOSTED_RUNNER: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Create and activate venv
        shell: bash
        run: |
          # Add Homebrew's bin directory to the PATH to find pyenv on Apple Silicon.
          export PATH="/opt/homebrew/bin:$PATH"
          eval "$(pyenv init --path)"
          pyenv global ${{ matrix.python-version }}
          $(pyenv which python) -m venv venv
          echo "PATH=$PWD/venv/bin:$PATH" >> $GITHUB_ENV
          echo "VIRTUAL_ENV=$PWD/venv" >> $GITHUB_ENV
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r manager/requirements.txt -r worker/requirements.txt -r requirements-dev.txt
      - name: Cache Managed Blender Tools
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: worker/sethlans_worker_agent/managed_tools
          key: ${{ runner.os }}-blender-cache-lts-${{ hashFiles('worker/sethlans_worker_agent/config.py') }}
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv,managed_tools,node_modules,migrations
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=venv,.venv,managed_tools,node_modules,migrations
      - name: Run Unit Tests
        run: pytest tests/unit
      - name: Run Integration Tests
        run: pytest tests/integration
      - name: Run End-to-End Tests
        run: pytest tests/e2e -x
      - name: Attempt to Unmount Any Lingering DMGs (macOS)
        if: always()
        run: |
          echo "Attempting to detach any lingering BlenderMount volumes..."
          hdiutil detach /Volumes/BlenderMount_* || echo "No lingering DMG mount found or detach failed."
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-self-hosted-macos-py${{ matrix.python-version }}
          path: |
            manager/logs/manager.log
            worker/sethlans_worker_agent/logs/worker.log
            worker/sethlans_worker_agent/worker_output/
            test_artifacts/
            !**/*.blend
          if-no-files-found: ignore