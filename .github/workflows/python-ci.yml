name: Sethlans Reborn CI

# GitHub-hosted Docker-based Linux CI (unit, integration, lint) is
# additionally handled by docker-test.yml using containerized test
# images. This workflow covers ONLY the native GitHub-hosted matrix
# (ubuntu/windows/macos) — catches platform-specific regressions Docker
# cannot (e.g. Windows path handling, macOS PySide6 splash segfaults,
# native Linux without containerization).
#
# Self-hosted runners (Linux GPU, Apple Silicon MacBook) live in
# python-ci-self-hosted.yml and are workflow_dispatch-only. They do
# NOT fire on push/PR — invoke them on demand via tools/run_ci.sh
# (or tools/run_ci.ps1).

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # --- GitHub-Hosted Native Matrix (ubuntu / windows / macos) ---
  build-and-test-github:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.14"]
    runs-on: ${{ matrix.os }}
    env:
      # Belt-and-suspenders: pytest.ini also sets this, but mirror the
      # self-hosted jobs' env-declaration style for visibility.
      SETHLANS_DISABLE_RELEASE_FETCH: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libglib2.0-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libx11-6 \
            libxxf86vm1 \
            libxrender1 \
            libxi6 \
            libglu1-mesa \
            libsm6 \
            libice6 \
            libxfixes3 \
            libxcursor1 \
            libxinerama1 \
            libxrandr2 \
            xvfb

      - name: Cache pip dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache pip dependencies (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r manager/requirements.txt -r worker/requirements.txt -r requirements-dev.txt

      - name: Cache Caddy binary
        uses: actions/cache@v5
        with:
          path: .venv-build/caddy
          key: caddy-${{ hashFiles('tools/caddy.lock') }}-${{ runner.os }}-${{ runner.arch }}

      - name: Fetch Caddy (Linux)
        if: runner.os == 'Linux'
        run: python tools/fetch_caddy.py --target-dir .venv-build/caddy --platform linux-amd64

      - name: Fetch Caddy (Windows)
        if: runner.os == 'Windows'
        run: python tools/fetch_caddy.py --target-dir .venv-build/caddy --platform windows-amd64

      - name: Fetch Caddy (macOS)
        if: runner.os == 'macOS'
        run: python tools/fetch_caddy.py --target-dir .venv-build/caddy --platform darwin-arm64

      - name: Cache Managed Blender Tools
        id: blender-cache
        uses: actions/cache@v5
        with:
          path: worker/sethlans_worker_agent/managed_tools
          key: ${{ runner.os }}-blender-lts-${{ hashFiles('worker/sethlans_worker_agent/config.py') }}

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv,managed_tools,node_modules,migrations
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=venv,.venv,managed_tools,node_modules,migrations

      - name: Run Unit Tests
        run: pytest tests/unit

      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: Install Playwright Chromium (Windows/macOS)
        if: runner.os != 'Linux'
        run: python -m playwright install chromium

      - name: Run Integration Tests
        run: pytest tests/integration

      - name: Start Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Run End-to-End Tests
        run: pytest tests/e2e

      - name: Attempt to Unmount Any Lingering DMGs (macOS)
        if: runner.os == 'macOS' && always()
        run: |
          echo "Attempting to detach any lingering BlenderMount volumes..."
          hdiutil detach /Volumes/BlenderMount_* || echo "No lingering DMG mount found or detach failed."

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            /tmp/e2e_*/**
            test_artifacts/
            !**/*.blend
          if-no-files-found: ignore