<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Sethlans &mdash; Finishing Up</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/wizard.css">
</head>
<body class="wizard-chrome">
  <noscript>
    <div class="container py-5">
      <div class="alert alert-warning" role="alert">
        This page needs JavaScript to complete setup.
        Please enable JavaScript and reload.
      </div>
    </div>
  </noscript>

  <script nomodule src="/static/js/legacy-fallback.js"></script>

  <main id="app" class="wizard-chrome-shell" v-cloak>
    <div class="card wizard-chrome-card">
      <header class="card-header">
        <h1 class="h5 text-center mb-3">Sethlans Setup</h1>
        <ol class="wizard-stepper" aria-label="Setup progress">
          <li
            v-for="step in stepper"
            :key="step.id"
            class="wizard-stepper-item"
            :class="{ 'is-current': step.isCurrent, 'is-completed': step.isCompleted }"
            :aria-current="step.isCurrent ? 'step' : null">
            <span class="wizard-stepper-circle" v-html="step.icon" aria-hidden="true"></span>
            <span class="wizard-stepper-label">{{ step.label }}</span>
          </li>
        </ol>
      </header>

      <div class="card-body text-center">
        <header class="mb-4">
          <h2 class="h3 mb-1">Finishing Up</h2>
          <p class="text-body-secondary mb-0">
            Saving your answers and signalling the launcher.
          </p>
        </header>

        <div v-if="!error" class="mb-3" :aria-busy="busy ? 'true' : 'false'">
          <div class="spinner-border text-primary" role="status" aria-hidden="true">
            <span class="visually-hidden">Working&hellip;</span>
          </div>
          <p class="mt-3 mb-0" aria-live="polite">{{ stageMessage }}</p>
        </div>

        <div v-if="error" class="alert alert-danger" role="alert" aria-live="assertive">
          <p class="mb-2">{{ error }}</p>
          <button
            type="button"
            class="btn btn-light btn-sm"
            @click="run">
            Retry
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="/static/vendor/bootstrap.bundle.min.js"></script>
  <script type="module" src="/static/js/done.js"></script>
</body>
</html>
