<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Sethlans &mdash; Choose Topology</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/wizard.css">
</head>
<body class="bg-body-tertiary">
  <noscript>
    <div class="container py-5">
      <div class="alert alert-warning" role="alert">
        This page needs JavaScript to submit your topology choice.
        Please enable JavaScript and reload.
      </div>
    </div>
  </noscript>

  <script nomodule>
    document.addEventListener('DOMContentLoaded', function () {
      var root = document.getElementById('app');
      if (root) {
        root.innerHTML =
          '<div class="container py-5">' +
          '  <div class="alert alert-danger" role="alert">' +
          '    <h2 class="h5 mb-2">Unsupported browser</h2>' +
          '    <p class="mb-0">' +
          '      The Sethlans setup wizard requires a modern browser ' +
          '      (Chrome 90+, Firefox 90+, Safari 14+, or Edge 90+). ' +
          '      Please open this page in a recent browser.' +
          '    </p>' +
          '  </div>' +
          '</div>';
      }
    });
  </script>

  <main id="app" class="container py-4 py-md-5" v-cloak>
    <header class="mb-4 text-center">
      <h1 id="topology-heading" class="h3 mb-1">Choose Topology</h1>
      <p class="text-body-secondary mb-0">
        Pick how this machine should run. You can change this later by re-running setup.
      </p>
    </header>

    <div class="row g-3 mb-4 topology-radiogroup" role="radiogroup" aria-labelledby="topology-heading">
      <div v-for="(choice, idx) in choices" :key="choice.id" class="col-12 col-md-4">
        <div
          class="card h-100 topology-card"
          :class="{ selected: selected === choice.id }"
          role="radio"
          :tabindex="(selected === choice.id || (selected === null && idx === 0)) ? 0 : -1"
          :aria-checked="selected === choice.id ? 'true' : 'false'"
          :aria-labelledby="'topology-card-label-' + choice.id"
          :aria-describedby="'topology-card-desc-' + choice.id"
          :data-choice-id="choice.id"
          @click="selectChoice(choice.id)">
          <div class="card-body">
            <h2 :id="'topology-card-label-' + choice.id" class="h5 mb-2">{{ choice.label }}</h2>
            <p :id="'topology-card-desc-' + choice.id" class="mb-0 text-body-secondary">{{ choice.desc }}</p>
          </div>
        </div>
      </div>
    </div>

    <div v-if="error" class="alert alert-danger" role="alert" aria-live="assertive">
      {{ error }}
    </div>

    <div class="d-grid d-md-flex justify-content-md-end">
      <button
        id="topology-submit"
        type="button"
        class="btn btn-primary btn-lg"
        :disabled="submitting || selected === null"
        :aria-disabled="(submitting || selected === null) ? 'true' : 'false'"
        @click="submit">
        <span v-if="submitting" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        <span v-if="submitting">Saving&hellip;</span>
        <span v-else>Continue</span>
      </button>
    </div>
  </main>

  <script src="/static/vendor/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { createApp } from '/static/vendor/petite-vue.js';

    const SESSION_KEY = 'wizard:sessionToken';
    const MESSAGE_KEY = 'wizard:flashMessage';

    const scope = {
      choices: [
        { id: 'manager', label: 'Manager only',
          desc: 'Run as a render farm controller. Workers connect to this machine.' },
        { id: 'manager_worker', label: 'Manager + Worker',
          desc: 'This machine controls the farm AND renders jobs.' },
        { id: 'worker_only', label: 'Worker only',
          desc: 'Connect to an existing manager and render jobs for it.' },
      ],
      selected: null,
      submitting: false,
      error: '',

      selectChoice(id) {
        this.selected = id;
        this.error = '';
      },

      _expireAndRedirect() {
        try {
          window.sessionStorage.removeItem(SESSION_KEY);
          window.sessionStorage.setItem(
            MESSAGE_KEY,
            'Your session expired — please paste the setup token again.',
          );
        } catch (_) {
          // sessionStorage may be disabled; navigate anyway.
        }
        window.location.assign('/');
      },

      async submit() {
        if (this.submitting || this.selected === null) {
          return;
        }
        const sessionToken = (() => {
          try {
            return window.sessionStorage.getItem(SESSION_KEY);
          } catch (_) {
            return null;
          }
        })();
        if (!sessionToken) {
          this._expireAndRedirect();
          return;
        }
        this.error = '';
        this.submitting = true;
        let response;
        try {
          response = await fetch('/api/wizard/topology/', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-Wizard-Session': sessionToken,
            },
            body: JSON.stringify({ topology: this.selected }),
            cache: 'no-store',
            credentials: 'omit',
          });
        } catch (_) {
          this.submitting = false;
          this.error = 'Network error. Check the launcher logs and try again.';
          return;
        }

        if (response.status === 200) {
          window.location.assign('/redirecting');
          return;
        }

        if (response.status === 401 || response.status === 403) {
          this._expireAndRedirect();
          return;
        }

        this.submitting = false;
        this.error = 'Something went wrong. Check the launcher logs and try again.';
      },
    };

    function focusByIndex(idx) {
      const cards = document.querySelectorAll('[role="radio"]');
      if (!cards.length) return;
      const target = cards[Math.max(0, Math.min(idx, cards.length - 1))];
      if (target) target.focus();
    }

    function findCardIndex(el) {
      const cards = Array.from(document.querySelectorAll('[role="radio"]'));
      return cards.indexOf(el);
    }

    function attachKeyboardHandler(app) {
      const group = document.querySelector('.topology-radiogroup');
      if (!group) return;
      group.addEventListener('keydown', (event) => {
        const target = event.target.closest('[role="radio"]');
        if (!target) return;
        const idx = findCardIndex(target);
        if (idx < 0) return;
        const total = scope.choices.length;
        if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
          event.preventDefault();
          const next = (idx + 1) % total;
          scope.selectChoice(scope.choices[next].id);
          // Wait for Petite-vue to update tabindex before focusing.
          requestAnimationFrame(() => focusByIndex(next));
        } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
          event.preventDefault();
          const prev = (idx - 1 + total) % total;
          scope.selectChoice(scope.choices[prev].id);
          requestAnimationFrame(() => focusByIndex(prev));
        } else if (event.key === ' ' || event.key === 'Enter') {
          event.preventDefault();
          const choice = scope.choices[idx];
          if (choice) scope.selectChoice(choice.id);
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const app = createApp(scope);
      app.mount('#app');
      // Attach the radiogroup keyboard handler after Petite-vue mounts
      // so the cards exist in the DOM (FR-W-FE9 + integration pattern
      // point 4 — manual handler, not data-bs-* attributes).
      attachKeyboardHandler(app);
    });
  </script>
</body>
</html>
