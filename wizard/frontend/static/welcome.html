<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Sethlans &mdash; Welcome</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/wizard.css">
</head>
<body class="wizard-chrome">
  <noscript>
    <div class="container py-5">
      <div class="alert alert-warning" role="alert">
        This page needs JavaScript to complete setup.
        Please enable JavaScript and reload.
      </div>
    </div>
  </noscript>

  <script nomodule src="/static/js/legacy-fallback.js"></script>

  <main id="app" class="d-flex align-items-center justify-content-center min-vh-100 py-4 px-3" v-cloak>
    <div class="card shadow-sm w-100 wizard-card">
      <div class="card-body p-4 p-md-5 text-center">

        <div
          v-if="resumeBanner"
          class="alert alert-info text-start"
          role="status"
          aria-live="polite">
          {{ resumeBanner }}
        </div>

        <header class="mb-4">
          <h1 class="h3 mb-1">Welcome</h1>
          <p class="text-body-secondary mb-0">
            We'll set up Sethlans in about two minutes.
          </p>
        </header>

        <p class="text-body-secondary">
          You'll choose a topology, configure networking and storage,
          and create the admin account. Each step is server-validated
          before you advance.
        </p>

        <div v-if="error" class="alert alert-danger" role="alert" aria-live="assertive">
          {{ error }}
        </div>

        <div class="d-grid mt-4">
          <button
            id="welcome-next"
            type="button"
            class="btn btn-primary btn-lg"
            :disabled="submitting"
            :aria-disabled="submitting ? 'true' : 'false'"
            @click="next">
            <span v-if="submitting" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            <span v-if="submitting">Continuing&hellip;</span>
            <span v-else>Next</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="/static/vendor/bootstrap.bundle.min.js"></script>
  <script type="module" src="/static/js/welcome.js"></script>
</body>
</html>
