# -----------------------------------------------------------------------
# SECURITY NOTE: Environment variables are visible via `docker inspect`.
# For stronger secret isolation, use Docker Swarm secrets or Kubernetes
# secrets. A future enhancement may add support for the _FILE pattern
# (e.g., SETHLANS_SECURITY_SECRET_KEY_FILE) to read secrets from mounted
# files.
# -----------------------------------------------------------------------

# NOTE: SQLite is suitable for single-instance manager deployments only.
# Do not scale the manager service to multiple replicas with SQLite.
# A future spec may add PostgreSQL support for multi-instance deployments.

services:
  manager:
    image: ghcr.io/dryad-naiad-software/sethlans-manager:latest
    build:
      context: ../../
      dockerfile: deploy/docker/manager/Dockerfile
    ports:
      - "8080:8080"
    # All manager state (database, media, the optional sethlans.ini,
    # TLS cert, FFmpeg, static files, logs) lives in /data, so it
    # survives a new container.
    # The manager runs as uid 1000, gid 1000. On a Linux host Docker
    # creates a missing ./data/manager owned by root, and the manager
    # then exits with code 3 and a message. Fix it once on the host,
    # before or after the first start:
    #   mkdir -p ./data/manager ./config/manager &&
    #     sudo chown -R 1000:1000 ./data ./config && sudo chmod 700 ./data/manager
    # Host user uid 1000 then has full access to the manager state
    # (database, TLS private key).
    volumes:
      - ./data/manager:/data
      - ./config/manager:/config
      # Uncomment for BYO TLS certs:
      # - ./certs:/certs
    environment:
      # REQUIRED: Set a unique Django secret key for production.
      # Compose will refuse to start if this variable is not set in .env or the shell.
      - SETHLANS_SECURITY_SECRET_KEY=${SETHLANS_SECURITY_SECRET_KEY:?Set SETHLANS_SECURITY_SECRET_KEY in .env}
      # Optional: Seed enrollment key into the manager DB
      - SETHLANS_SECURITY_ENROLLMENT_KEY=${SETHLANS_SECURITY_ENROLLMENT_KEY:-}
      # Optional: Friendly name for multicast discovery
      - SETHLANS_ENROLLMENT_NAME=${SETHLANS_ENROLLMENT_NAME:-Sethlans Manager}
      # Optional: Override advertised IP for multicast
      - SETHLANS_ENROLLMENT_ADVERTISED_IP=${SETHLANS_ENROLLMENT_ADVERTISED_IP:-}
      # Optional: BYO TLS cert paths (inside container)
      - SETHLANS_TLS_CERT_FILE=${SETHLANS_TLS_CERT_FILE:-}
      - SETHLANS_TLS_KEY_FILE=${SETHLANS_TLS_KEY_FILE:-}
      # The first admin account, made on the first start from
      # SETHLANS_ADMIN_USERNAME in .env and the sethlans_admin_password
      # secret below (the password is never a variable). With no admin
      # account and no username, the manager exits with code 12. Once an
      # admin exists these are ignored.
      - SETHLANS_ADMIN_USERNAME=${SETHLANS_ADMIN_USERNAME:-}
      - SETHLANS_ADMIN_PASSWORD_FILE=${SETHLANS_ADMIN_USERNAME:+/run/secrets/sethlans_admin_password}
      - SETHLANS_ADMIN_EMAIL=${SETHLANS_ADMIN_EMAIL:-}
    secrets:
      - sethlans_admin_password
    restart: unless-stopped

  worker:
    image: ghcr.io/dryad-naiad-software/sethlans-worker-cpu:latest
    build:
      context: ../../
      dockerfile: deploy/docker/worker-cpu/Dockerfile
    ports:
      - "8081:8081"
    volumes:
      - ./data/worker:/data
      - ./config/worker:/config
    environment:
      # Manager connection (defaults to the compose manager service).
      # NOTE: SETHLANS_MANAGER_HOST and SETHLANS_MANAGER_PORT are env var
      # names shared by both the manager and worker config systems.
      # On the manager, they control the bind address/port; on the worker,
      # they control the target manager address/port for enrollment.
      - SETHLANS_MANAGER_HOST=${SETHLANS_MANAGER_HOST:-manager}
      - SETHLANS_MANAGER_PORT=${SETHLANS_MANAGER_PORT:-8080}
      # Enrollment key for unattended registration
      - SETHLANS_WORKER_ENROLLMENT_KEY=${SETHLANS_WORKER_ENROLLMENT_KEY:-}
      # The worker page password (it guards the control actions on the
      # worker page, port 8081), from the worker_ui_password secret
      # below (the password is never a variable). The worker reads it
      # at every start and keeps only a hash; a password that breaks
      # the page password rules stops the worker with an error.
      - SETHLANS_WORKER_UI_PASSWORD_FILE=/run/secrets/worker_ui_password
    secrets:
      - worker_ui_password
    depends_on:
      manager:
        condition: service_healthy
    restart: unless-stopped

secrets:
  # The first admin's password, on one line in ./secrets/admin_password.
  # The manager runs as uid 1000 and must be able to read the file:
  #   chmod 600 ./secrets/admin_password &&
  #     sudo chown 1000:1000 ./secrets/admin_password
  # Once the admin exists the file may be emptied, but it must exist.
  sethlans_admin_password:
    file: ./secrets/admin_password
  # The worker page password, on one line in ./secrets/worker_ui_password:
  # at least 8 characters, not all digits, not like the worker's host
  # name. The worker runs as uid 1000 and must be able to read the file:
  #   chmod 600 ./secrets/worker_ui_password &&
  #     sudo chown 1000:1000 ./secrets/worker_ui_password
  # To change the password, edit the file and restart the worker.
  worker_ui_password:
    file: ./secrets/worker_ui_password
