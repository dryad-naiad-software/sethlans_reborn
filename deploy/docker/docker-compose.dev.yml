# -----------------------------------------------------------------------
# Development compose override.
# Usage:
#   docker compose -f deploy/docker/docker-compose.yml \
#                  -f deploy/docker/docker-compose.dev.yml up --build
#
# Or via the convenience script:
#   ./tools/docker-dev.sh up
#
# Run Django management commands inside the running manager container:
#   docker compose -f deploy/docker/docker-compose.yml \
#                  -f deploy/docker/docker-compose.dev.yml \
#                  exec manager python manage.py <command>
# -----------------------------------------------------------------------

services:
  manager:
    build:
      context: ../../
      dockerfile: deploy/docker/manager/Dockerfile.dev
    init: true
    ports:
      - "8080:8080"
      - "4200:4200"
    # Source-tree layout: the manager imports shared/ from the parent of
    # manager/, and the container entrypoint lives in launcher/.
    volumes:
      - ../../manager:/app/manager
      - ../../shared:/app/shared
      - ../../launcher:/app/launcher
      - frontend-node-modules:/app/manager/frontend/node_modules
      - dev-db:/data
    environment:
      - SETHLANS_SECURITY_DEBUG=true
      - SETHLANS_SECURITY_SECRET_KEY=dev-insecure-key-for-local-development-only
    command: []
    healthcheck:
      test: ["CMD", "python", "/app/launcher/container_healthcheck.py"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker:
    build:
      context: ../../
      dockerfile: deploy/docker/worker-cpu/Dockerfile
    # Mount only the source, not all of worker/ over /app: that would
    # hide the image's /app/shared/ package and the Caddy binary in
    # /app/.venv-build/.
    volumes:
      - ../../worker/sethlans_worker_agent:/app/sethlans_worker_agent
      - ../../worker/run_worker.py:/app/run_worker.py
      - ../../shared:/app/shared
      - dev-worker-data:/data
    environment:
      - SETHLANS_MANAGER_HOST=manager
      - SETHLANS_MANAGER_PORT=8080

# The dev admin's password file. tools/docker-dev.sh and docker-dev.ps1
# make it (random, under .tmp/docker-dev/), set SETHLANS_ADMIN_USERNAME
# (default "admin") and print where the password is.
secrets:
  sethlans_admin_password:
    file: ${SETHLANS_DEV_ADMIN_PASSWORD_FILE:?Start the dev stack with tools/docker-dev.sh or tools/docker-dev.ps1}

volumes:
  dev-db:
  dev-worker-data:
  frontend-node-modules:
